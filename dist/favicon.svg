<svg viewBox="0 0 64 64" width="64" height="64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Degradado cristal verde salvia para las 3 hojas en triángulo -->
    <linearGradient id="leafGlass" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9BE3B1" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#3E7B52" stop-opacity="0.78" />
    </linearGradient>
    <!-- Degradado Naranja Habanero vibrante para el fruto central -->
    <linearGradient id="habaneroGrad" x1="32" y1="22" x2="32" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9436" />
      <stop offset="55%" stop-color="#F25C19" />
      <stop offset="100%" stop-color="#C83506" />
    </linearGradient>
    <!-- Resplandor suave del habanero central -->
    <filter id="habaneroGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#F25C19" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fondo squircle oscuro con borde translúcido -->
  <rect width="64" height="64" rx="16" fill="#112217" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>

  <!-- 3 Hojas dispuestas en Triángulo Equilátero (Representando las 3 plantas) -->
  <!-- Hoja Superior-Izquierda -->
  <path d="M31 9C23 14 17 23 17 31C23 28 28 21 31 9Z" fill="url(#leafGlass)" stroke="rgba(255,255,255,0.55)" stroke-width="1.1" stroke-linejoin="round" />
  <!-- Hoja Superior-Derecha -->
  <path d="M33 9C41 14 47 23 47 31C41 28 36 21 33 9Z" fill="url(#leafGlass)" stroke="rgba(255,255,255,0.55)" stroke-width="1.1" stroke-linejoin="round" />
  <!-- Hojas de Base Triangular (Izquierda y Derecha) -->
  <path d="M12 49C13 39 18 33 25 32C24 40 19 46 12 49Z" fill="url(#leafGlass)" stroke="rgba(255,255,255,0.5)" stroke-width="1.1" stroke-linejoin="round" />
  <path d="M52 49C51 39 46 33 39 32C40 40 45 46 52 49Z" fill="url(#leafGlass)" stroke="rgba(255,255,255,0.5)" stroke-width="1.1" stroke-linejoin="round" />
  <path d="M14 51C21 47 27 47 31 51C25 53 19 53 14 51Z" fill="url(#leafGlass)" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-linejoin="round" />
  <path d="M50 51C43 47 37 47 33 51C39 53 45 53 50 51Z" fill="url(#leafGlass)" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-linejoin="round" />

  <!-- Tallo curvado del Chile Habanero -->
  <path d="M32 25C32 21.5 33.8 19.2 35.5 18.5" stroke="#B6E8A7" stroke-width="2" stroke-linecap="round" />

  <!-- Fruto Central del Chile Habanero -->
  <path filter="url(#habaneroGlow)" d="M32 25.2C27.2 24.6 24.5 27.8 25 32.8C25.4 37.2 28.5 41.8 32 43.8C35.5 41.8 38.6 37.2 39 32.8C39.5 27.8 36.8 24.6 32 25.2Z" fill="url(#habaneroGrad)" stroke="rgba(255,220,180,0.55)" stroke-width="0.9" />
  <!-- Gajo central característico del habanero para volumen 3D -->
  <path d="M32 25.8C29.8 29.5 29.8 37.5 32 43.2" stroke="rgba(255,255,255,0.28)" stroke-width="1" stroke-linecap="round" />
  <path d="M32 25.8C34.2 29.5 34.2 37.5 32 43.2" stroke="rgba(140,30,0,0.28)" stroke-width="1" stroke-linecap="round" />

  <!-- Punto de Luz LED cálido en el cáliz superior -->
  <circle cx="32" cy="25.2" r="1.6" fill="#FFF3B0" />
</svg>
