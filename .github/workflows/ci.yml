name: CI El Chilito
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOCALAPPDATA: /tmp/chilito-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Instalar dependencias fijadas
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Preparar secretos efimeros
        working-directory: backend
        run: python -m tools.preparar_instalacion --solo-secretos
      - name: Iniciar PostgreSQL aislado
        run: docker compose up -d --wait --wait-timeout 120 db
      - name: Crear roles y base de pruebas
        working-directory: backend
        run: python -m tools.preparar_pruebas
      - name: Migrar con rol migrador
        working-directory: backend
        env:
          ELCHILITO_DB_SCOPE: test
          ELCHILITO_DB_ROLE: migrador
        run: python manage.py migrate --noinput
      - name: Revisar configuracion y migraciones
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          python -m pip check
          python manage.py check --settings=config.settings.testing
          python manage.py makemigrations --check --dry-run --settings=config.settings.testing
      - name: Probar acceso, permisos y consultas con rol limitado
        working-directory: backend
        run: python manage.py test tests --verbosity 2 --settings=config.settings.testing
      - name: Revisar sintaxis del frontend
        run: find dist -name '*.js' -not -path '*/desarrollo/*' -print0 | xargs -0 -r -n 1 node --check
      - name: Detener servicios efimeros
        if: always()
        run: docker compose stop db
