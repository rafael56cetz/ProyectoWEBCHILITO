<text x="68" y="972" font-family="Arial, sans-serif" font-size="18" fill="#20322c" font-weight="600" text-anchor="start">
<tspan x="68" dy="0">LEYENDA · Flechas: datos · Marco discontinuo: confianza/acceso · Cruces sin punto: sin unión</tspan>
</text>
<text x="68" y="1005" font-family="Arial, sans-serif" font-size="18" fill="#20322c" font-weight="400" text-anchor="start">
<tspan x="68" dy="0">F01–F11 y F16: operación local. F12–F15: salida a correo externo. El HTTP y PostgreSQL locales no usan TLS.</tspan>
</text>
<rect x="45" y="1030" width="1710" height="110" rx="14" fill="#f7f7f7" stroke="#c8d0cc" stroke-width="2"/>
