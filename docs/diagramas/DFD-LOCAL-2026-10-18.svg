<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
<title id="title">El Chilito: arquitectura, flujos de datos y límites de confianza</title>
<desc id="desc">Diagrama de la web local real. Navegador, Django, PostgreSQL Docker, archivos privados y correo Gmail. Flechas F01 a F16 detalladas en el catálogo. ESP32 y otras funciones futuras no tienen conexiones activas.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#315f4a"/></marker></defs>
